<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Device Inventory Scanner</title>
<style>
  :root {
    --bg: #eef0f3;
    --surface: #ffffff;
    --surface-sunken: #f4f5f7;
    --ink: #14161c;
    --ink-soft: #5c6270;
    --ink-faint: #9298a3;
    --border: #dde0e6;
    --border-strong: #c7cbd3;
    --accent: #2f4ecf;
    --accent-ink: #ffffff;
    --danger: #c23a4f;
    --radius-lg: 10px;
    --radius-md: 8px;
    --radius-sm: 6px;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;

    --type-out: #a85a05;
    --type-out-bg: #fbf0df;
    --type-in: #0f7a4d;
    --type-in-bg: #e5f5ec;
    --type-sold: #5b3fb5;
    --type-sold-bg: #eeebfb;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  input, select, textarea, button { font-family: inherit; }

  /* ---------- PIN screen ---------- */
  .screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 26px;
    width: 100%;
    max-width: 400px;
  }
  .pin-icon {
    width: 40px; height: 40px; border-radius: var(--radius-sm);
    background: var(--ink);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin-bottom: 16px; font-weight: 700;
  }
  h1 { font-size: 19px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 20px; line-height: 1.4; }

  label {
    display: block; font-size: 11.5px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 14px 0 6px;
  }
  label:first-of-type { margin-top: 0; }

  input[type=text], input[type=date], input[type=password], input[type=tel], input[type=email], select, textarea {
    width: 100%;
    font-size: 16px;
    padding: 11px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-sunken);
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
    transition: border-color .12s;
  }
  #scannedId, #pinInput { font-family: var(--mono); letter-spacing: 0.02em; }
  input::placeholder, textarea::placeholder { color: var(--ink-faint); }
  textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent); background: var(--surface);
  }

  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%235c6270' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    padding-right: 32px;
  }

  .field-row { display: flex; gap: 10px; }
  .field-row > * { flex: 1; min-width: 0; }

  button { border: none; cursor: pointer; font-family: inherit; }

  .btn-primary {
    background: var(--accent); color: var(--accent-ink);
    font-size: 15px; font-weight: 700;
    padding: 13px 16px; border-radius: var(--radius-sm);
  }
  .btn-primary:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--surface-sunken); color: var(--ink);
    font-size: 15px; font-weight: 600;
    padding: 13px 16px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:active { background: var(--border); }

  .error { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 16px; font-weight: 600; }
  .hint { color: var(--ink-faint); font-size: 12px; margin: 8px 2px 0; line-height: 1.4; }

  /* ---------- App shell ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .topbar-title { display: flex; align-items: center; gap: 9px; }
  .topbar-title .mark {
    width: 26px; height: 26px; border-radius: var(--radius-sm);
    background: var(--ink);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0; font-weight: 700;
  }
  .topbar h1 { font-size: 14.5px; margin: 0; letter-spacing: -0.005em; font-weight: 700; }
  .version { font-size: 11px; color: var(--ink-faint); font-family: var(--mono); margin: 1px 0 0; }
  #pinVersion { margin: -12px 0 20px; }
  .gear {
    background: var(--surface-sunken); border: 1.5px solid var(--border);
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    font-size: 15px; display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
  }
  .gear:active { background: var(--border); }

  main { max-width: 640px; margin: 0 auto; padding: 14px 14px 32px; }

  /* Single-sheet layout: one continuous form instead of stacked cards */
  .sheet {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .field-group { padding: 16px 16px 18px; }
  .field-group + .field-group { border-top: 1px solid var(--border); }
  .section-label {
    font-size: 11px; font-weight: 700; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 0 0 10px;
  }

  /* Type segmented control */
  .segment {
    display: flex; gap: 4px;
    background: var(--surface-sunken);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
  }
  .segment button {
    flex: 1;
    background: transparent;
    padding: 12px 6px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    white-space: nowrap;
    transition: background .12s, color .12s;
  }
  .segment button[aria-pressed="true"] { background: var(--surface); border: 1px solid var(--border-strong); }
  .segment button[data-type="Loaner Out"][aria-pressed="true"] { color: var(--type-out); }
  .segment button[data-type="Loaner In"][aria-pressed="true"] { color: var(--type-in); }
  .segment button[data-type="Sold / Client Assigned"][aria-pressed="true"] { color: var(--type-sold); }

  .type-banner {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700;
    padding: 8px 11px; border-radius: var(--radius-sm);
    margin-top: 10px;
  }
  .type-banner .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .type-banner.out { background: var(--type-out-bg); color: var(--type-out); }
  .type-banner.out .dot { background: var(--type-out); }
  .type-banner.in { background: var(--type-in-bg); color: var(--type-in); }
  .type-banner.in .dot { background: var(--type-in); }
  .type-banner.sold { background: var(--type-sold-bg); color: var(--type-sold); }
  .type-banner.sold .dot { background: var(--type-sold); }

  .scan-row { display: flex; gap: 8px; align-items: stretch; }
  .scan-row input { flex: 1; min-width: 0; }
  .btn-scan {
    background: var(--ink); color: #fff; white-space: nowrap;
    padding: 0 15px; border-radius: var(--radius-sm);
    font-size: 13.5px; font-weight: 700;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .btn-scan:active { background: #000; }

  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .actions button { flex: 1; }

  [hidden] { display: none !important; }

  /* ---------- Camera modal ---------- */
  #scanModal {
    position: fixed; inset: 0; background: #000; z-index: 50;
    display: flex; flex-direction: column;
  }
  #scanModal video { flex: 1; width: 100%; object-fit: cover; background: #000; }
  .scan-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center; pointer-events: none;
  }
  .scan-box { width: 78%; max-width: 420px; height: 120px; border: 2px solid #fff; border-radius: 10px; opacity: 0.9; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4); }
  .scan-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 18px calc(18px + env(safe-area-inset-bottom, 0px)) calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 10px; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
  }
  .scan-bar button { flex: 1; }
  .scan-status {
    position: absolute; top: calc(20px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center;
    color: #fff; font-size: 13.5px; font-weight: 600; padding: 0 20px; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  /* ---------- Settings modal ---------- */
  #settingsModal {
    position: fixed; inset: 0; background: rgba(10,12,18,0.45); z-index: 60;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #settingsModal .card {
    max-width: 460px; border-radius: 16px 16px 0 0; margin: 0;
    padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  }

  @media (min-width: 560px) {
    main { padding: 20px 20px 40px; }
  }
</style>
</head>
<body>

<!-- PIN screen -->
<div class="screen" id="pinScreen">
  <div class="card">
    <div class="pin-icon">•••</div>
    <h1>Device Inventory Scanner</h1>
    <p class="sub">Enter your PIN to continue</p>
    <p class="version" id="pinVersion"></p>
    <label for="pinInput">PIN</label>
    <input type="password" id="pinInput" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="••••••" maxlength="12">
    <div class="error" id="pinError"></div>
    <div class="actions">
      <button class="btn-primary" id="pinSubmit" style="flex:1">Unlock</button>
    </div>
  </div>
</div>

<!-- Main app -->
<div id="app" hidden>
  <div class="topbar">
    <div class="topbar-title">
      <div class="mark">IN</div>
      <div>
        <h1>Device Inventory</h1>
        <p class="version" id="appVersion"></p>
      </div>
    </div>
    <button class="gear" id="openSettings" title="Settings">⚙</button>
  </div>

  <main>
    <div class="sheet">

      <div class="field-group">
        <p class="section-label">Event Type</p>
        <div class="segment" id="typeSegment" role="group">
          <button type="button" data-type="Loaner Out" aria-pressed="true">Loaner Out</button>
          <button type="button" data-type="Loaner In" aria-pressed="false">Loaner In</button>
          <button type="button" data-type="Sold / Client Assigned" aria-pressed="false">Sold</button>
        </div>
        <div class="type-banner out" id="typeBanner">
          <span class="dot"></span><span id="typeBannerText">Device is leaving the office as a loaner</span>
        </div>
      </div>

      <div class="field-group">
        <p class="section-label">Device</p>
        <label for="scannedId">Serial / Asset Tag</label>
        <div class="scan-row">
          <input type="text" id="scannedId" placeholder="Scan or type ID" autocomplete="off">
          <button type="button" class="btn-scan" id="openScan">📷 Scan</button>
        </div>

        <div class="field-row">
          <div>
            <label for="deviceType">Device Type</label>
            <select id="deviceType">
              <option value="Laptop">Laptop</option>
              <option value="Dock">Dock</option>
              <option value="Monitor">Monitor</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="deviceModel">Model</label>
            <input type="text" id="deviceModel" placeholder="e.g. ThinkPad T14">
          </div>
        </div>
      </div>

      <div class="field-group">
        <p class="section-label">Assignment</p>
        <div class="field-row">
          <div>
            <label for="client">Client</label>
            <input type="text" id="client" placeholder="Client / company name">
          </div>
          <div>
            <label for="contact">Contact / User</label>
            <input type="text" id="contact" placeholder="Contact or user">
          </div>
        </div>
      </div>

      <div class="field-group">
        <p class="section-label">Dates</p>
        <div class="field-row">
          <div>
            <label for="scanDate">Date</label>
            <input type="date" id="scanDate">
          </div>
          <div id="returnDateGroup">
            <label for="returnDate">Return Date</label>
            <input type="date" id="returnDate">
          </div>
        </div>
      </div>

      <div class="field-group">
        <p class="section-label">Notes</p>
        <label for="notes">Condition / Notes</label>
        <textarea id="notes" placeholder="Condition, accessories, issues, etc."></textarea>
      </div>

    </div>

    <div class="error" id="formError"></div>

    <div class="actions">
      <button class="btn-secondary" id="clearForm">Clear</button>
      <button class="btn-primary" id="submitForm">OK — Email It</button>
    </div>
    <p class="hint">This opens Outlook with the details pre-filled. Review and hit Send.</p>
  </main>
</div>

<!-- Camera / scan modal -->
<div id="scanModal" hidden>
  <div class="scan-status" id="scanStatus">Point the camera at the barcode</div>
  <video id="video" muted playsinline></video>
  <div class="scan-overlay"><div class="scan-box"></div></div>
  <div class="scan-bar">
    <button class="btn-secondary" id="cancelScan">Cancel</button>
  </div>
</div>

<!-- Settings modal -->
<div id="settingsModal" hidden>
  <div class="card">
    <h1>Settings</h1>
    <label for="sendToEmail">Send report to</label>
    <input type="email" id="sendToEmail" placeholder="name@example.com">
    <div class="actions">
      <button class="btn-secondary" id="closeSettings">Close</button>
      <button class="btn-primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function () {
  "use strict";

  var CORRECT_PIN = "111222";
  var DEFAULT_EMAIL = "cpoconnell93@gmail.com";
  var RETURN_DEFAULT_DAYS = 7;

  // Bump this on every change that ships. Shown on the PIN screen and in the
  // topbar so it's obvious at a glance whether you're on the latest build.
  var APP_VERSION = "v1.4 · 2026-08-12";
  document.getElementById("pinVersion").textContent = APP_VERSION;
  document.getElementById("appVersion").textContent = APP_VERSION;

  // ---------- PIN gate ----------
  var pinScreen = document.getElementById("pinScreen");
  var app = document.getElementById("app");
  var pinInput = document.getElementById("pinInput");
  var pinError = document.getElementById("pinError");
  var scannedIdInput = document.getElementById("scannedId");

  function enterApp() {
    pinScreen.hidden = true;
    app.hidden = false;
    // Land the cursor right on the scan field so the first tap after unlock is "scan".
    scannedIdInput.focus();
  }

  function tryUnlock() {
    if (pinInput.value === CORRECT_PIN) {
      sessionStorage.setItem("inv_unlocked", "1");
      enterApp();
    } else {
      pinError.textContent = "Incorrect PIN.";
      pinInput.value = "";
      pinInput.focus();
    }
  }

  document.getElementById("pinSubmit").addEventListener("click", tryUnlock);
  pinInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryUnlock();
  });

  if (sessionStorage.getItem("inv_unlocked") === "1") {
    enterApp();
  }

  // ---------- Settings ----------
  var settingsModal = document.getElementById("settingsModal");
  var sendToEmail = document.getElementById("sendToEmail");

  function getRecipient() {
    return localStorage.getItem("inv_recipient") || DEFAULT_EMAIL;
  }

  document.getElementById("openSettings").addEventListener("click", function () {
    sendToEmail.value = getRecipient();
    settingsModal.hidden = false;
  });
  document.getElementById("closeSettings").addEventListener("click", function () {
    settingsModal.hidden = true;
  });
  document.getElementById("saveSettings").addEventListener("click", function () {
    var val = sendToEmail.value.trim();
    if (val) localStorage.setItem("inv_recipient", val);
    settingsModal.hidden = true;
  });

  // ---------- Type segmented control ----------
  var typeSegment = document.getElementById("typeSegment");
  var typeButtons = Array.prototype.slice.call(typeSegment.querySelectorAll("button"));
  var typeBanner = document.getElementById("typeBanner");
  var typeBannerText = document.getElementById("typeBannerText");
  var returnDateGroup = document.getElementById("returnDateGroup");
  var returnDate = document.getElementById("returnDate");
  var currentType = "Loaner Out";

  var TYPE_META = {
    "Loaner Out": { cls: "out", text: "Device is leaving the office as a loaner" },
    "Loaner In": { cls: "in", text: "Device is being checked back in" },
    "Sold / Client Assigned": { cls: "sold", text: "Device is being sold or permanently assigned" }
  };

  function isoDatePlusDays(days) {
    var d = new Date();
    d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function setType(type) {
    currentType = type;
    typeButtons.forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.dataset.type === type ? "true" : "false");
    });
    var meta = TYPE_META[type];
    typeBanner.className = "type-banner " + meta.cls;
    typeBannerText.textContent = meta.text;
    returnDateGroup.hidden = type !== "Loaner Out";
    // Pre-fill a sensible return date so Loaner Out rarely needs a date-picker tap.
    if (type === "Loaner Out" && !returnDate.value) {
      returnDate.value = isoDatePlusDays(RETURN_DEFAULT_DAYS);
    }
  }

  typeButtons.forEach(function (btn) {
    btn.addEventListener("click", function () { setType(btn.dataset.type); });
  });
  setType("Loaner Out");

  // ---------- Form defaults ----------
  var scanDate = document.getElementById("scanDate");
  function todayIso() { return isoDatePlusDays(0); }
  function setToday() { scanDate.value = todayIso(); }
  setToday();

  document.getElementById("clearForm").addEventListener("click", function () {
    document.getElementById("scannedId").value = "";
    document.getElementById("deviceType").value = "Laptop";
    document.getElementById("deviceModel").value = "";
    document.getElementById("client").value = "";
    document.getElementById("contact").value = "";
    returnDate.value = "";
    document.getElementById("notes").value = "";
    document.getElementById("formError").textContent = "";
    setType("Loaner Out");
    setToday();
    scannedIdInput.focus();
  });

  // ---------- Keyboard flow: Enter jumps to the next field ----------
  var tabOrder = ["scannedId", "client", "contact", "notes"];
  tabOrder.forEach(function (id, i) {
    var el = document.getElementById(id);
    el.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      if (el.tagName === "TEXTAREA" && !e.metaKey && !e.ctrlKey) return; // allow newlines in notes
      e.preventDefault();
      var next = document.getElementById(tabOrder[i + 1]);
      if (next) { next.focus(); if (next.select) next.select(); }
      else document.getElementById("submitForm").click();
    });
  });

  // ---------- Barcode scanning ----------
  var scanModal = document.getElementById("scanModal");
  var scanStatus = document.getElementById("scanStatus");
  var video = document.getElementById("video");
  var codeReader = null;
  var currentStream = null;

  function stopScan() {
    if (codeReader) {
      try { codeReader.reset(); } catch (e) {}
    }
    if (currentStream) {
      currentStream.getTracks().forEach(function (t) { t.stop(); });
      currentStream = null;
    }
    scanModal.hidden = true;
  }

  document.getElementById("cancelScan").addEventListener("click", stopScan);

  // Zoom in a bit on cameras that support it, so a normal working distance
  // fills the frame instead of requiring you to lean in close.
  function applyAutoZoom() {
    if (!currentStream) return;
    var track = currentStream.getVideoTracks()[0];
    if (!track || !track.getCapabilities) return;
    var caps = track.getCapabilities();
    if (!caps.zoom) return;
    var target = Math.min(caps.max, Math.max(caps.min, caps.min + (caps.max - caps.min) * 0.35));
    track.applyConstraints({ advanced: [{ zoom: target }] }).catch(function () {});
  }

  function openScan() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById("formError").textContent = "Camera not available. Make sure you're using https:// (not a local file), and allow camera access.";
      return;
    }
    scanStatus.textContent = "Point the camera at the barcode";
    scanModal.hidden = false;

    // Limit to the formats asset tags/serials actually use — fewer formats
    // to try per frame means the decoder locks on faster.
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.DATA_MATRIX
    ]);
    // A distant barcode is just a few dozen pixels wide at 720p, which is
    // why it needs to fill the frame to decode. TRY_HARDER catches those
    // small/angled reads that the fast pass misses.
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    codeReader = new ZXing.BrowserMultiFormatReader(hints);
    codeReader.decodeFromConstraints(
      {
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          advanced: [{ focusMode: "continuous" }]
        }
      },
      video,
      function (result, err) {
        if (result) {
          scannedIdInput.value = result.getText();
          if (navigator.vibrate) navigator.vibrate(60);
          stopScan();
          // Jump straight to Client after a successful scan — the two things every entry needs.
          document.getElementById("client").focus();
        }
      }
    ).then(function (controls) {
      if (video.srcObject) currentStream = video.srcObject;
      applyAutoZoom();
    }).catch(function (err) {
      scanStatus.textContent = "Camera error: " + (err && err.message ? err.message : err);
    });
  }

  document.getElementById("openScan").addEventListener("click", openScan);

  // ---------- Submit / email ----------
  document.getElementById("submitForm").addEventListener("click", function () {
    var type = currentType;
    var scannedId = document.getElementById("scannedId").value.trim();
    var deviceType = document.getElementById("deviceType").value;
    var deviceModel = document.getElementById("deviceModel").value.trim();
    var client = document.getElementById("client").value.trim();
    var contact = document.getElementById("contact").value.trim();
    var date = scanDate.value;
    var notes = document.getElementById("notes").value.trim();
    var formError = document.getElementById("formError");

    if (!scannedId || !client) {
      formError.textContent = "Please fill in at least the Serial/Asset Tag and Client.";
      return;
    }
    if (type === "Loaner Out" && !returnDate.value) {
      formError.textContent = "Please set a projected return date for a loaner going out.";
      return;
    }
    formError.textContent = "";

    var subject = type.toUpperCase() + ": " + deviceType + " " + scannedId + " — " + client;
    var bodyLines = [
      "Type: " + type,
      "Serial / Asset Tag: " + scannedId,
      "Device Type: " + deviceType,
      "Model: " + (deviceModel || "-"),
      "Client: " + client,
      "Contact / User: " + (contact || "-"),
      "Date: " + date
    ];
    if (type === "Loaner Out") {
      bodyLines.push("Projected Return Date: " + returnDate.value);
    }
    bodyLines.push("Notes: " + (notes || "-"));
    var body = bodyLines.join("\n");

    var mailto = "mailto:" + encodeURIComponent(getRecipient()) +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);

    window.location.href = mailto;
  });
})();
</script>
</body>
</html>
